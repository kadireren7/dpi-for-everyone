name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make re
      - run: strip dpi-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: dpi-proxy-linux-x86_64
          path: dpi-proxy

  # Linux transparent mode must still pass its real end-to-end cycle
  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      - run: ./scripts/e2e-test-linux.sh

  macos:
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - run: echo "SSL=$RUNNER_TEMP/openssl-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openssl-${{ matrix.arch }}
          key: openssl-3.5.8-${{ matrix.arch }}-macos11-v1
      - run: ./scripts/macos/build-openssl.sh "$SSL" ${{ matrix.arch }}
      - run: make test OPENSSL_PREFIX="$SSL"
      - run: make clean && make all OPENSSL_PREFIX="$SSL" OPENSSL_STATIC=1
      - run: |
          ./scripts/macos/package.sh dpi-proxy-macos-${{ matrix.arch }}
          ditto -c -k --keepParent dpi-proxy-macos-${{ matrix.arch }} dpi-proxy-macos-${{ matrix.arch }}.zip
      # a release is only built from a package that passed the same
      # end-to-end test as CI, on the machine type it is for
      - name: extract the zip and run the transparent mode end-to-end test
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          ditto -x -k dpi-proxy-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/pkg"
          ./scripts/macos/e2e-test.sh "$RUNNER_TEMP/pkg/dpi-proxy-macos-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dpi-proxy-macos-${{ matrix.arch }}
          path: dpi-proxy-macos-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl make curl unzip zip
      - run: ./scripts/windows/fetch-windivert.sh
      - run: make windows CC_WIN=gcc OPENSSL_WIN_PREFIX=/mingw64
      - run: ./scripts/windows/package.sh dpi-proxy-windows-x86_64
      # a release is only built from a folder that passed the same
      # end-to-end test as CI
      - name: transparent mode end-to-end (real WinDivert, Administrator)
        shell: pwsh
        run: ./scripts/windows/e2e-test.ps1 -Package dpi-proxy-windows-x86_64
      - run: zip -r dpi-proxy-windows-x86_64.zip dpi-proxy-windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: dpi-proxy-windows-x86_64
          path: dpi-proxy-windows-x86_64.zip

  publish:
    # nothing is published unless every build and every end-to-end
    # test (Linux, Windows, macOS arm64 + x86_64) passed
    needs: [linux, linux-e2e, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: package
        run: |
          mkdir -p release
          cp dist/dpi-proxy-linux-x86_64/dpi-proxy release/dpi-proxy-linux-x86_64
          cp dist/dpi-proxy-macos-arm64/dpi-proxy-macos-arm64.zip release/
          cp dist/dpi-proxy-macos-x86_64/dpi-proxy-macos-x86_64.zip release/
          cp dist/dpi-proxy-windows-x86_64/dpi-proxy-windows-x86_64.zip release/
          chmod +x release/dpi-proxy-linux-x86_64
          (cd release && sha256sum dpi-proxy-linux-x86_64 dpi-proxy-macos-arm64.zip \
            dpi-proxy-macos-x86_64.zip dpi-proxy-windows-x86_64.zip > SHA256SUMS)
      # The only place a release is created: notes come from
      # .github/release-notes/<tag>.md when present.
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          # v1.2.3-rc1, -beta...: a pre-release, never "Latest"
          case "${{ github.ref_name }}" in
            *-*) set -- "$@" --prerelease --latest=false ;;
          esac
          gh release create "${{ github.ref_name }}" \
            release/dpi-proxy-linux-x86_64 \
            release/dpi-proxy-macos-arm64.zip \
            release/dpi-proxy-macos-x86_64.zip \
            release/dpi-proxy-windows-x86_64.zip \
            release/SHA256SUMS \
            --title "dpi-for-everyone ${{ github.ref_name }}" \
            "$@"
